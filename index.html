<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071018">
<title>EX™ ARABIA STRIKE — MAX TECH V2</title>
<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
<div id="app">
  <canvas id="game" width="304" height="224"></canvas>
  <section id="menu" class="screen menu">
    <img src="./assets/cover-main.webp" class="cover" alt="ARABIA STRIKE">
    <div class="shade"></div>
    <div class="brand">フサム | experience™ <span>EX™ PLAYABLE WORLDS</span></div>
    <div class="menu-ui">
      <small>MAX TECH V2 // 304×224 // 59.18Hz</small>
      <button id="play" class="primary">PLAY NOW // ابدأ الآن</button>
      <button id="coop">2P LOCAL CO-OP</button>
      <button id="settings">CRT / AUDIO / INPUT</button>
    </div>
  </section>

  <div id="hud" class="hidden" dir="ltr">
    <div><b id="score">000000</b><small id="lives">●●●</small></div>
    <div class="mid"><span id="mission">MISSION 001 // RED COAST</span><i><b id="progress"></b></i></div>
    <div><span id="weapon">PULSE MG</span><small id="ammo">∞</small></div>
  </div>
  <div id="boss" class="hidden"><span>SAND COLOSSUS</span><i><b id="bossbar"></b></i></div>
  <div id="toast"></div>
  <div id="crt"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
